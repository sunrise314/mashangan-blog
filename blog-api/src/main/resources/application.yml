server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: blog-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:blog}
    username: ${DB_USER:halo_pg}
    password: ${DB_PASSWORD:HaloPg_2026_x9k2}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    # 与 Halo 一致省略 null 字段
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  jwt:
    # 生产环境必须通过 JWT_SECRET 环境变量覆盖
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32bytes-minimum!!}
    expire-minutes: ${JWT_EXPIRE_MINUTES:720}
  attachment:
    dir: ${ATTACHMENT_DIR:/data/attachments}
    max-size-bytes: 10485760
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:Admin@2026}
  migration:
    # 仅 --spring.profiles.active=migrate-halo 时生效
    halo-base-url: ${HALO_BASE_URL:http://localhost:8090}
    page-size: 100
    attachment-dir: ${MIGRATION_ATTACHMENT_DIR:}
  studio:
    # AI 配图流水线密钥
    zhipu-key: ${ZHIPU_API_KEY:}
    pexels-key: ${PEXELS_API_KEY:}
    siliconflow-key: ${SILICONFLOW_API_KEY:}
